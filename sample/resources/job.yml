
resources:
  jobs:
    reporting_api_job:

      name: reporting-api-job

      tasks:
        - task_key: reporting-api-task

          spark_python_task:
            python_file: ../src/sample/reporting_api.py

          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1

      schedule:
        quartz_cron_expression: "0 0 9 * * ?"
        timezone_id: "Asia/Kolkata"

        pause_status: UNPAUSED