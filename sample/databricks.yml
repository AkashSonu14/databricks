# This is a Databricks asset bundle definition for sample.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sample
  uuid: 1d025062-8d73-4c4b-8d85-9328861dffd6

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b41210d2-2c92.cloud.databricks.com
      profile: dev
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-b41210d2-2c92.cloud.databricks.com
      profile: prod
      # We explicitly deploy to /Workspace/Users/akasha14122001@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/akasha14122001@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: akasha14122001@gmail.com
        level: CAN_MANAGE
